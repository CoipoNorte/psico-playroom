<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSICO PLAYROOM - Simple</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
    }
    .app { padding: 20px; text-align: center; }
    .title { font-size: 2.5rem; margin-bottom: 1rem; }
    .room-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 2rem 0; }
    .room-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; padding: 1.5rem; cursor: pointer; transition: all 0.3s; }
    .room-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.2); }
    .room-icon { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const rooms = [
      { id: 'play', name: 'Sala de Juegos', icon: '🎮', color: '#FF6B6B', desc: 'Juguetes interactivos' },
      { id: 'art', name: 'Sala de Arte', icon: '🎨', color: '#4ECDC4', desc: 'Expresión creativa' },
      { id: 'puzzle', name: 'Sala de Puzzles', icon: '🧩', color: '#45B7D1', desc: 'Desarrollo cognitivo' },
      { id: 'nature', name: 'Sala de Naturaleza', icon: '🌳', color: '#96CEB4', desc: 'Calma y relajación' },
      { id: 'reading', name: 'Sala de Lectura', icon: '📚', color: '#FFEAA7', desc: 'Cuentos y narrativas' },
    ];

    function App() {
      const [currentRoom, setCurrentRoom] = useState(null);

      if (currentRoom) {
        return (
          <div className="app">
            <button onClick={() => setCurrentRoom(null)} style={{ marginBottom: '1rem', padding: '0.5rem 1rem', background: 'transparent', border: '2px solid white', color: 'white', borderRadius: '10px', cursor: 'pointer' }}>
              ← Volver
            </button>
            <h2>{rooms.find(r => r.id === currentRoom)?.name}</h2>
            <div id="canvas" style={{ width: '100%', height: '500px', marginTop: '2rem', background: 'rgba(255,255,255,0.05)', borderRadius: '20px' }}></div>
          </div>
        );
      }

      return (
        <div className="app">
          <h1 className="title">🧠 PSICO PLAYROOM</h1>
          <p>Simulación 2D de salas psicológicas interactivas</p>
          <div className="room-grid">
            {rooms.map(room => (
              <div key={room.id} className="room-card" style={{ backgroundColor: room.color }} onClick={() => setCurrentRoom(room.id)}>
                <span className="room-icon">{room.icon}</span>
                <h3>{room.name}</h3>
                <p>{room.desc}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
